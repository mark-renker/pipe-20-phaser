# Tag v* -> macOS universal .pkg installer (+ raw bundles zip) and Windows zip, attached to a GitHub Release.
name: release
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal, JUCE 8.0.6 + clap-juce-extensions via FetchContent)
        run: cmake -B build-universal -DCMAKE_BUILD_TYPE=Release && cmake --build build-universal -j 4
      - run: ./build-universal/pipe20_tests
      - name: Package installer
        run: packaging/make_installer.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/* }
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --parallel --target Pipe20Phaser_VST3 Pipe20Phaser_CLAP Pipe20Phaser_Standalone pipe20_tests pipe20_render
      - shell: bash
        run: |
          ./build/Release/pipe20_tests.exe
          VERSION=$(sed -n 's/^project(Pipe20Phaser VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          OUT="Pipe-20 Phaser $VERSION (Windows)"; mkdir -p "$OUT" dist
          cp -R "build/Pipe20Phaser_artefacts/Release/VST3/Pipe-20 Phaser.vst3" "$OUT/"
          cp "build/Pipe20Phaser_artefacts/Release/CLAP/Pipe-20 Phaser.clap" "$OUT/"
          cp "build/Pipe20Phaser_artefacts/Release/Standalone/Pipe-20 Phaser.exe" "$OUT/"
          cp build/Release/pipe20_render.exe resources/tunables.json "$OUT/"
          cp packaging/INSTALL-Windows.txt "$OUT/INSTALL.txt"
          7z a "dist/Pipe20Phaser-$VERSION-Windows-x64.zip" "$OUT"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          body: |
            ## Install
            **macOS** (11+, Apple Silicon + Intel): download `Pipe20Phaser-*-macOS.pkg`, open it (right-click > Open if Gatekeeper objects: the installer is not notarized), tick the formats you want. Done; rescan plug-ins in your DAW.
            **Windows** (x64): download `Pipe20Phaser-*-Windows-x64.zip`, unzip, copy the `.vst3` folder to `C:\Program Files\Common Files\VST3\` and the `.clap` to `C:\Program Files\Common Files\CLAP\`.
            The plug-in appears under **Renky Denk > Pipe-20 Phaser**. The `-macOS-bundles.zip` holds the raw bundles for manual installs.
          generate_release_notes: true
